<body>
  <form id="signupForm">
    <input type="text" id="name" placeholder="Enter your name">
    <p id="nameError" hidden>Must not be empty.</p>
    <input type="email" id="email" placeholder="Email" />
    <p id="emailError" hidden>Email must conatain @.</p>
    <input type="password" id="password" placeholder="password" />
    <p id="passwordError" hidden>Password must be atleast 8 characters.</p>
    <input type="password" id="confirmPassword" placeholder="password" />
    <p id="confirmPasswordError" hidden>
      must match the password field exactly.
    </p>
    <div>
      <input type="checkbox" id="terms" value="terms" />
      <label for="terms">I, Agree to the terms.</label>
    </div>
    <button type="submit" id="submitBtn" disabled>Sign Up</button>
    <script src="comparing.js"></script>
  </form>
</body>
